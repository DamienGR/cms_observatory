{% load menu_tags i18n %}{% for language in languages %}{% if language.0 != current_language %}{% get_language_info for language.0 as info %}
<li class="nav-item"><a class="nav-link" href="{% page_language_url language.0 %}" lang="{{ language.0 }}" hreflang="{{ language.0 }}">{{ info.name_local|capfirst }}</a></li>
{% endif %}{% endfor %}
